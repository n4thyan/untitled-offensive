name: Playable PR Validation

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  compile-and-test:
    if: github.head_ref == 'fix/playable-alpha-lifecycle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev

      - uses: Swatinem/rust-cache@v2

      # The repository currently has unrelated rustfmt and new-Clippy debt.
      # This temporary PR gate answers the narrower playable-alpha question:
      # does the workspace compile and do its logic tests pass?
      - name: Check
        run: cargo check --workspace --all-targets

      - name: Test
        run: cargo test --workspace
